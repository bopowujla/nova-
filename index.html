var idb=null;

async function idbPut(){try{idb=idb||await idbOpen();if(!idb)return;idb.transaction('kv','readwrite').objectStore('kv').put(JSON.stringify(S),'state')}catch(e){}}
async function idbInit(){try{idb=await idbOpen();if(!idb)return;const g=idb.transaction('kv').objectStore('kv').get('state');g.onsuccess=()=>{try{const raw=g.result;if(!raw){idbPut();return}const r=JSON.parse(raw);if((r.ts||0)>(S.ts||0)){Object.keys(S).forEach(k=>delete S[k]);Object.assign(S,r);S.exp=S.exp||[];S.oi=S.oi||[];S.fc=S.fc||[];S.pots=S.pots||[];try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}normFin();buildCats();render();toast('Данные восстановлены из резервного хранилища')}else if((S.ts||0)>(r.ts||0))idbPut()}catch(e){}}}catch(e){}}

function applyThemeOld(){const r=document.documentElement;if(S.theme&&S.theme!=='auto')r.dataset.theme=S.theme;else delete r.dataset.theme;const wc=S.work&&(S.work.hex||(WC[S.work.color]||[])[1]);if(wc)r.style.setProperty('--work',wc);else r.style.removeProperty('--work');const w=S.work||{};const cs=S.cs||{},cf=(cs.fill!=null?cs.fill:32)+'%',cb=({'0':0,'1':45,'2':90}[cs.bd||'1'])+'%';r.style.setProperty('--wf',cf);r.style.setProperty('--wb',cb);r.style.setProperty('--cf',cf);r.style.setProperty('--cb',cb);['--bg','--card','--ink','--acc','--line','--mt','--on'].forEach(k=>r.style.removeProperty(k));if(S.theme==='custom'&&S.ct){const t=S.ct,q=parseInt(t.acc.slice(1),16),lum=((q>>16)*299+((q>>8)&255)*587+(q&255)*114)/1000;r.style.setProperty('--bg',t.bg);r.style.setProperty('--card',t.card);r.style.setProperty('--ink',t.ink);r.style.setProperty('--acc',t.acc);r.style.setProperty('--line','color-mix(in srgb,'+t.ink+' 14%,'+t.card+')');r.style.setProperty('--mt','color-mix(in srgb,'+t.ink+' 55%,'+t.card+')');r.style.setProperty('--on',lum>150?'#14161b':'#fff')}r.style.setProperty('--r',S.rad||'16px');r.style.setProperty('--bw',S.bw||'1px')}
